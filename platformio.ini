; Ojos OLED 1.3" (SSD1306 I2C). Mismo codigo para las dos placas.
[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.0
    bblanchon/ArduinoJson@^7.2.0

; ESP32-C3 (SuperMini / DevKitM-1)
[env:esp32c3]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32-c3-devkitm-1
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; NodeMCU v3 (ESP8266, ESP-12E)
; display() por I2C (software en ESP8266) tarda ~30 ms a 400 kHz: sin margen para WiFi en 33 ms/frame
; (medido: cae a 15-21 fps). Se usa 20 fps; las duraciones de las animaciones estan en ms y no cambian.
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
build_flags = -Wno-unused-variable -DEYES_TICK_MS=50
